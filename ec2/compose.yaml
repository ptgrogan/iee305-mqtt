name: iee305-l20-broker

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports:
      - "8883:8883"  # MQTT over TLS; WebSockets arrive through the web service
    volumes:
      - type: bind
        source: ./mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./acl
        target: /mosquitto/config/acl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runtime/auth
        target: /mosquitto/auth
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: tls
        target: /mosquitto/certs
        read_only: true
      - mqtt-data:/mosquitto/data
    healthcheck:
      # Mosquitto rereads certfile/keyfile on SIGHUP. Send one after certbot
      # replaces the certificate, so renewal never disconnects clients.
      test: ["CMD-SHELL", "[ /mosquitto/certs/fullchain.pem -ot /tmp/certs-loaded ] || { touch /tmp/certs-loaded && kill -HUP 1; }"]
      interval: 1h
      start_period: 1m
      start_interval: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    # Serves the browser client in web/ and passes MQTT over WebSockets to
    # Mosquitto, both over HTTPS on port 443 with the same certificate.
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "443:443"    # Browser page, and MQTT over secure WebSockets (students, Pi)
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./web
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: tls
        target: /certs
        read_only: true
    healthcheck:
      # Like Mosquitto's: reload nginx after certbot replaces the certificate.
      # A reload keeps open WebSocket connections on the old worker processes.
      test: ["CMD-SHELL", "[ /certs/fullchain.pem -ot /tmp/certs-loaded ] || { touch /tmp/certs-loaded && nginx -s reload; }"]
      interval: 1h
      start_period: 1m
      start_interval: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    # Renews the Let's Encrypt certificate; setup.sh obtains the first one.
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    ports:
      - "80:80"  # HTTP-01 challenge; certbot listens only while renewing
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        while :; do
          certbot renew --quiet --deploy-hook 'sh /hooks/deploy.sh'
          sleep 43200 & wait $$!
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - tls:/out
      - type: bind
        source: ./certbot-deploy.sh
        target: /hooks/deploy.sh
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mqtt-data:
  letsencrypt:
  tls:
