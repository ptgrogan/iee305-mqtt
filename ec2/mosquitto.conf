# Mosquitto 2.1: file plugins provide authentication and topic authorization.
global_plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/auth/passwd
global_plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl

# Classroom limits. Sessions left behind by tutorial code that sets
# clean_session=False expire instead of queueing messages indefinitely.
max_queued_messages 200
persistent_client_expiration 1d

# MQTT over WebSockets, behind nginx. Clients connect to nginx on port 443,
# which passes networks that block 8883; nginx ends TLS and forwards WebSocket
# connections here. Compose does not publish this port, so only nginx reaches it.
listener 8080
protocol websockets
listener_allow_anonymous false
max_connections 400

# Native MQTT over TLS, with the Let's Encrypt certificate installed by
# certbot-deploy.sh, so clients verify it with their normal public CA store.
listener 8883
protocol mqtt
listener_allow_anonymous false
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
max_connections 400

persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout
connection_messages true
log_type error
log_type warning
log_type notice
log_type information
