# Port 443 carries both the browser page and MQTT over secure WebSockets.
# nginx ends TLS with the certbot certificate, forwards WebSocket upgrade
# requests on any path to Mosquitto, and serves everything else from web/.
# Paho asks for path /mqtt and Zigbee2MQTT for /, so route on the Upgrade
# header rather than the path. nginx's default 1024 worker_connections covers
# Mosquitto's 400-client limit; each proxied client uses two connections.

map $http_upgrade $is_websocket {
    ~*^websocket$ 1;
    default 0;
}

server {
    listen 443 ssl;
    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /usr/share/nginx/html;

    # The page loads only its own files and MQTT.js, and talks only to this broker.
    # MQTT.js runs its keepalive timer in a blob: worker, which background tabs
    # do not throttle.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; worker-src blob:; connect-src 'self' wss://$host; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        error_page 418 = @mqtt;
        if ($is_websocket) {
            return 418;
        }
        try_files $uri $uri/ =404;
    }

    location @mqtt {
        # Docker's DNS resolves the service name on each request, so a
        # recreated Mosquitto container with a new address is still found.
        resolver 127.0.0.11 valid=10s;
        set $mosquitto http://mosquitto:8080;
        proxy_pass $mosquitto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        # nginx closes a proxied connection after 60 s without traffic by
        # default, which a quiet client with a 60 s MQTT keepalive can reach.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
